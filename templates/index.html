<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Modbus Dash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233b82f6' d='M13 2 4 14h7l-1 8 9-12h-7z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css">
<script type="module" src="/static/js/app.js"></script>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="nav-toggle" aria-label="Menu" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <span class="topbar-title">MODBUS DASH</span>
  <span class="topbar-status" id="topbar-status"></span>
</header>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <h1>MODBUS DASH</h1>
    <span id="app-version">Monitoring liczników energii</span>
  </div>
  <nav class="sidebar-nav" aria-label="Nawigacja">
    <div class="nav-section">Monitoring</div>
    <a class="nav-item" href="#dashboard" data-view="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard</a>
    <a class="nav-item" href="#devices" data-view="devices">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 6h6M9 10h6"/><circle cx="12" cy="16" r="2"/></svg>
      Urządzenia</a>
    <div class="nav-section">Narzędzia</div>
    <a class="nav-item" href="#scanner" data-view="scanner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Skaner rejestrów</a>
    <a class="nav-item" href="#presets" data-view="presets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      Presety</a>
    <div class="nav-section">System</div>
    <a class="nav-item" href="#connections" data-view="connections">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>
      Połączenia</a>
    <a class="nav-item" href="#integrations" data-view="integrations">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h4l3-8 4 16 3-8h2"/></svg>
      Integracje</a>
    <a class="nav-item" href="#help" data-view="help">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
      Pomoc</a>
  </nav>
  <div class="sidebar-footer">
    <div class="conn-status" role="status" aria-live="polite">
      <span class="conn-dot" id="health-dot"></span>
      <span id="health-text">Ładowanie...</span>
    </div>
    <div class="sim-badge" id="sim-badge" hidden>Symulator aktywny</div>
  </div>
</aside>
<div class="backdrop" id="nav-backdrop" hidden></div>

<main class="main" id="main" tabindex="-1">
  <div class="view-loading"><span class="spinner"></span></div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<noscript><p class="noscript">Modbus Dash wymaga włączonego JavaScriptu.</p></noscript>
</body>
</html>
